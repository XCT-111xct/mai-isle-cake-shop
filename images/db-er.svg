<svg id="db-er" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 680 900" role="graphics-document document" aria-roledescription="er">
<style>
#db-er{font-family:"trebuchet ms",verdana,arial,sans-serif;background-color:#ffffff;}
.entity{fill:#ECECFF;stroke:#9370DB;stroke-width:1.5;}
.header{fill:#9370DB;}
.hname{font:bold 13px sans-serif;fill:#ffffff;}
.frow{fill:#ffffff;}
.frow-alt{fill:#F5F5FF;}
.fname{font:11px sans-serif;fill:#333333;}
.ftype{font:10px sans-serif;fill:#666666;text-anchor:end;}
.pk{fill:#E67E22;font:bold 8px sans-serif;}
.fk{fill:#2980B9;font:bold 8px sans-serif;}
.uk{fill:#27AE60;font:bold 8px sans-serif;}
.rel{stroke:#9370DB;stroke-width:1.5;fill:none;}
.rel-l{stroke:#9370DB;stroke-width:1.5;stroke-dasharray:6,4;fill:none;}
.rl{font:9px sans-serif;fill:#8E6BB5;}
.ttl{font:bold 16px sans-serif;fill:#333333;}
.sub{font:11px sans-serif;fill:#888888;}
.legend{font:10px sans-serif;fill:#555555;}
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9370DB"/>
  </marker>
</defs>

<text class="ttl" x="20" y="26">麦屿手作 Mai-Isle · 数据库 E-R 图（升级版 · 含字段明细）</text>
<text class="sub" x="20" y="44">8 张表 · 实线=物理外键（FK 约束） · 虚线=逻辑关系（快照/业务语义，无 FK 字段）</text>

<!-- ===================== 左列：category / cake_spec ===================== -->
<!-- category -->
<g transform="translate(16,56)">
  <rect class="entity" width="200" height="112"/>
  <rect class="header" width="200" height="26"/>
  <text class="hname" x="100" y="17" text-anchor="middle">category 分类表</text>
  <rect class="frow" y="26" width="200" height="17"/><text class="fname" x="10" y="39">id<tspan class="pk">  PK</tspan></text><text class="ftype" x="190" y="39">INT</text>
  <rect class="frow-alt" y="43" width="200" height="17"/><text class="fname" x="10" y="56">name<tspan class="uk">  UK</tspan></text><text class="ftype" x="190" y="56">TEXT</text>
  <rect class="frow" y="60" width="200" height="17"/><text class="fname" x="10" y="73">sort_order</text><text class="ftype" x="190" y="73">INT</text>
  <rect class="frow-alt" y="77" width="200" height="17"/><text class="fname" x="10" y="90">created_at</text><text class="ftype" x="190" y="90">DATETIME</text>
</g>

